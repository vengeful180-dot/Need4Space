<script>
// The first seconds, before the game's code runs: its files arriving (index.html preloads them all), the bar's first
// tenth. main.js takes the bar over once it starts (window.__loadTaken).
(function () {
  // The title remains readable if the optional image is late or unavailable.
  var logo = new Image();
  logo.src = document.getElementById('brand-image').getAttribute('href');
  logo.decode().then(function () { document.documentElement.classList.add('logo-ready'); }, function () {});
  var want = document.querySelectorAll('link[rel=modulepreload]').length || 40, got = 0, seen = {};
  var fill = document.getElementById('lfill'), txt = document.getElementById('loadtext'), pct = document.getElementById('loadpct');
  function show() {
    if (window.__loadTaken) return;
    var p = Math.min(1, got / want) * 10;
    fill.style.transform = 'scaleX(' + (p / 100) + ')';
    txt.textContent = 'Downloading the game';
    pct.textContent = Math.round(p) + ' %';
  }
  try {
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (e) { if (/\.js(\?|$)/.test(e.name) && !seen[e.name]) { seen[e.name] = 1; got++; } });
      show();
    }).observe({ type: 'resource', buffered: true });
  } catch (e) { /* no observer: the bar still moves */ }
  show();
})();
</script>
